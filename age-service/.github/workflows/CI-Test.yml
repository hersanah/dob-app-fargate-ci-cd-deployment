name: age-service-api integration test
run-name: ${{ github.actor }} is testing out Github Actions 🚀

# This workflow will be triggered whenever there is a push or pull request on the develop branch.
# You can include additional branches by adding them to the array.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"
        type: choice
        options:
          - info
          - warning
          - debug

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is running on a ${{ runner.os }} server hosted by Github."
      - run: echo "The name of your branch is  ${{ github.ref }} and your repository is ${{ github.repository }}."

  build:
    runs-on: "ubuntu-latest"
    steps:
      # clone repository code to virtual machine on github.
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11 on github virtual machine
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Execute build (if applicable)
        run: |
          # Python typically doesn't require a build step
          # Add any build commands here if needed (e.g., compiling Cython extensions)
          echo "Build completed (Python source is ready to run)"

  test:
    runs-on: "ubuntu-latest"
    needs: build
    steps:
      # clone repository code to virtual machine on github.
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11 on github virtual machine
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Execute test
        run: pytest